[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agentic-runtime"
version = "0.1.0"
description = "Persistent agent tasks for Python applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "SushilDluffy"}]
dependencies = ["pydantic>=2.10,<3", "filelock>=3.16,<4", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
openai = ["openai>=1.60,<3"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.9", "build>=1.2"]
benchmark = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
